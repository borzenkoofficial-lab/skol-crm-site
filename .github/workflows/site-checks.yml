name: Site checks
on:
  pull_request:
  push:
    branches: [main, feat/mclaren-inspired-cinematic-experience]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check:js
